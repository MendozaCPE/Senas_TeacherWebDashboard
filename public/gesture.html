<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENAS Gesture Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a1628;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #overlay {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #letter-display {
            display: inline-block;
            background: rgba(15, 49, 114, 0.85);
            padding: 16px 32px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(12px);
            min-width: 180px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #letter {
            color: #FFD700;
            font-size: 64px;
            font-weight: bold;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        #confidence {
            color: #4ECDC4;
            font-size: 14px;
            margin-top: 2px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .dot.active {
            background: #10B981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .dot.waiting {
            background: #F59E0B;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .dot.error {
            background: #EF4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 20;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            z-index: 5;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FF6B6B);
            transition: width 0.3s ease;
            width: 0%;
            border-radius: 0 2px 2px 0;
        }

        /* Status bar at top */
        #status-bar {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
            pointer-events: none;
        }

        #status-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px 6px 10px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #status-bar-left .dot {
            width: 8px;
            height: 8px;
            margin-right: 0;
        }

        #status-bar-left .label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            font-weight: 500;
        }

        #fps-display {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="status-bar">
            <div id="status-bar-left">
                <span class="dot waiting" id="statusDot"></span>
                <span class="label" id="statusText">Initializing...</span>
            </div>
            <div id="fps-display">⚡ 0 FPS</div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <div style="font-size:18px;font-weight:600;color:white;">Loading SENAS...</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:8px;">Initializing camera and models</div>
        </div>

        <div id="overlay">
            <div id="letter-display">
                <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:2px;">
                    <span
                        style="color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;letter-spacing:1px;">DETECTED</span>
                </div>
                <div id="letter">✋</div>
                <div id="confidence">Confidence: 0%</div>
                <div id="status"></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="confidenceBar"></div>
        </div>
    </div>

    <!-- Load MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    @verbatim
    <script>
        // ============================================================
        // YOUR HEURISTIC FUNCTIONS (copied from Python)
        // ============================================================
        function getFingerStates(landmarks) {
            const tips = [4, 8, 12, 16, 20];
            const dips = [3, 6, 10, 14, 18];
            const fingers = [];

            const thumbExtended = Math.abs(landmarks[4].x - landmarks[2].x) > 0.045;
            fingers.push(thumbExtended);

            for (let i = 1; i < tips.length; i++) {
                const extended = landmarks[tips[i]].y < landmarks[dips[i]].y;
                fingers.push(extended);
            }
            return fingers;
        }

        function getDistance3D(p1, p2) {
            return Math.sqrt(
                Math.pow(p1.x - p2.x, 2) +
                Math.pow(p1.y - p2.y, 2) +
                Math.pow(p1.z - p2.z, 2)
            );
        }

        function getDistance2D(p1, p2) {
            return Math.sqrt(
                Math.pow(p1.x - p2.x, 2) +
                Math.pow(p1.y - p2.y, 2)
            );
        }

        function applyCriticalDlyOverrides(predicted, avgConf, landmarks) {
            const fingers = getFingerStates(landmarks);
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexDip = landmarks[7];
            const indexMcp = landmarks[5];
            const middleTip = landmarks[12];
            const middleMcp = landmarks[9];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            const isIndexHooked = (indexTip.y > indexDip.y) || (Math.abs(indexTip.x - indexDip.x) > 0.02 && !fingers[1]);
            const othersDown = !fingers[2] && !fingers[3] && !fingers[4];

            if (isIndexHooked && othersDown && ['L', 'Y', 'X', '?'].includes(predicted)) {
                return { letter: 'X', confidence: 0.98 };
            }

            const isBShape = fingers[1] && fingers[2] && fingers[3] && fingers[4];
            if (isBShape) {
                return { letter: 'B', confidence: 0.98 };
            }

            const indexUpState = fingers[1];
            const distThumbToMiddle3D = getDistance3D(thumbTip, middleTip);
            const distThumbToRing3D = getDistance3D(thumbTip, ringTip);
            const distThumbToMiddle2D = getDistance2D(thumbTip, middleTip);
            const ringMcpY = landmarks[13].y;
            const areFingersCurledToPalm = (middleTip.y > middleMcp.y) && (ringTip.y > ringMcpY);
            const distThumbToPalmCenter = getDistance2D(thumbTip, middleMcp);

            const isFormingD = (
                distThumbToMiddle3D < 0.10 ||
                distThumbToRing3D < 0.10 ||
                distThumbToMiddle2D < 0.08 ||
                (areFingersCurledToPalm && distThumbToPalmCenter < 0.10)
            );

            if (indexUpState && !isIndexHooked) {
                if (isFormingD) {
                    return { letter: 'D', confidence: 0.99 };
                }
                const isThumbStretchedWide = Math.abs(thumbTip.x - indexMcp.x) > 0.075;
                if (isThumbStretchedWide) {
                    return { letter: 'L', confidence: 0.96 };
                }
            }

            if (fingers[4] && !fingers[1] && !fingers[2] && !fingers[3]) {
                const isThumbActiveY = Math.abs(thumbTip.x - indexMcp.x) > 0.055;
                if (isThumbActiveY && pinkyTip.y < landmarks[19].y) {
                    return { letter: 'Y', confidence: 0.98 };
                }
            }

            return { letter: predicted, confidence: avgConf };
        }

        function applyUvwxyRules(predicted, avgConf, fingers, fingerSpread, landmarks) {
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const indexMcp = landmarks[5];
            const middleMcp = landmarks[9];
            const thumbTip = landmarks[4];

            const isCrossed = indexTip.x > middleTip.x + 0.003;
            const indexUp = indexTip.y < landmarks[6].y;
            const middleUp = middleTip.y < landmarks[10].y;
            const ringDown = landmarks[16].y > landmarks[13].y;
            const pinkyDown = landmarks[20].y > landmarks[17].y;

            const indexExtendedSideways = Math.abs(indexTip.x - indexMcp.x) > 0.06;
            const middleExtendedSideways = Math.abs(middleTip.x - middleMcp.x) > 0.06;

            const isThumbCenteredK = Math.abs(thumbTip.y - middleMcp.y) < 0.06 &&
                (Math.min(indexTip.x, indexMcp.x) <= thumbTip.x <= Math.max(middleTip.x, middleMcp.x) ||
                    Math.abs(thumbTip.x - middleMcp.x) < 0.05);

            if ((indexExtendedSideways && middleExtendedSideways && ringDown && pinkyDown) ||
                (predicted === 'K' && ringDown && pinkyDown)) {
                if (isThumbCenteredK) {
                    return { letter: 'K', confidence: 0.99 };
                }
            }

            if (indexUp && middleUp && ringDown && pinkyDown) {
                if (isCrossed) {
                    return { letter: 'R', confidence: 0.98 };
                }
                return { letter: fingerSpread > 0.055 ? 'V' : 'U', confidence: 0.98 };
            }

            if (fingers[1] && fingers[2] && fingers[3] && !fingers[4]) {
                return { letter: 'W', confidence: 0.95 };
            }

            return { letter: predicted, confidence: avgConf };
        }

        function applyMnsRules(predicted, avgConf, fingers, landmarks) {
            const indexTipY = landmarks[8].y;
            const indexMcp = landmarks[5];
            const middleMcp = landmarks[9];
            const middleTipY = landmarks[12].y;
            const middlePipY = landmarks[10].y;
            const thumbTip = landmarks[4];
            const indexPip = landmarks[6];
            const extendedCount = fingers.filter(f => f).length;

            const thumbTip2 = landmarks[4];
            const indexTip2 = landmarks[8];
            const middleTip2 = landmarks[12];
            const ringTip2 = landmarks[16];
            const pinkyTip2 = landmarks[20];

            const distThumbIndex = Math.sqrt(
                Math.pow(thumbTip2.x - indexTip2.x, 2) +
                Math.pow(thumbTip2.y - indexTip2.y, 2)
            );
            const distThumbMiddle = Math.sqrt(
                Math.pow(thumbTip2.x - middleTip2.x, 2) +
                Math.pow(thumbTip2.y - middleTip2.y, 2)
            );
            const distThumbRing = Math.sqrt(
                Math.pow(thumbTip2.x - ringTip2.x, 2) +
                Math.pow(thumbTip2.y - ringTip2.y, 2)
            );
            const distThumbPinky = Math.sqrt(
                Math.pow(thumbTip2.x - pinkyTip2.x, 2) +
                Math.pow(thumbTip2.y - pinkyTip2.y, 2)
            );

            if (distThumbIndex < 0.08 && distThumbMiddle < 0.08 &&
                distThumbRing < 0.08 && distThumbPinky < 0.08) {
                return { letter: 'O', confidence: 0.95 };
            }

            if (predicted in ['A', 'O'] && avgConf > 0.75) {
                return { letter: predicted, confidence: avgConf };
            }

            const isEShape = (indexTipY < indexMcp.y && middleTipY < indexMcp.y) && extendedCount === 0;
            if (isEShape) {
                if (['S', 'E', 'M', 'N'].includes(predicted)) {
                    return { letter: 'E', confidence: 0.95 };
                }
            }

            if (extendedCount === 0 && !isEShape) {
                const isSThumbPose = (thumbTip.y < middlePipY + 0.01) && (thumbTip.x > indexPip.x - 0.01);
                if (['S', 'N'].includes(predicted) && !isSThumbPose) {
                    if (thumbTip.x <= middleMcp.x) {
                        return { letter: 'N', confidence: 0.96 };
                    }
                }
                if (isSThumbPose || predicted === 'S') {
                    return { letter: 'S', confidence: 0.95 };
                }
                if (predicted === 'M' || (predicted === 'N' && avgConf < 0.70)) {
                    return { letter: thumbTip.x > middleMcp.x ? 'M' : 'N', confidence: 0.95 };
                }
            }

            return { letter: predicted, confidence: avgConf };
        }

        // Main detection function
        function detectLetter(landmarks) {
            if (!landmarks || landmarks.length < 21) {
                return { letter: '✋', confidence: 0 };
            }

            try {
                const fingers = getFingerStates(landmarks);
                const fingerSpread = Math.abs(landmarks[8].x - landmarks[12].x);

                // Heuristic detection for J and Z
                const othersDown = !fingers[2] && !fingers[3] && !fingers[4];
                const indexUp = fingers[1];
                const pinkyUp = fingers[4];
                const thumbTip = landmarks[4];
                const indexMCP = landmarks[5];

                // J: Pinky up, others down
                if (pinkyUp && othersDown) {
                    return { letter: 'J', confidence: 0.85 };
                }

                // Z: Index up, others down, thumb tucked
                const thumbTucked = Math.abs(thumbTip.x - indexMCP.x) < 0.05 && thumbTip.y > indexMCP.y - 0.02;
                if (indexUp && othersDown && !pinkyUp && thumbTucked) {
                    return { letter: 'Z', confidence: 0.90 };
                }

                // Apply all heuristic rules
                let result = { letter: 'A', confidence: 0.5 };
                result = applyCriticalDlyOverrides(result.letter, result.confidence, landmarks);
                result = applyUvwxyRules(result.letter, result.confidence, fingers, fingerSpread, landmarks);
                result = applyMnsRules(result.letter, result.confidence, fingers, landmarks);

                return result;
            } catch (error) {
                console.error('Detection error:', error);
                return { letter: '✋', confidence: 0 };
            }
        }

        // ============================================================
        // MEDIAPIPE SETUP
        // ============================================================
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const letterElement = document.getElementById('letter');
        const confidenceElement = document.getElementById('confidence');
        const confidenceBar = document.getElementById('confidenceBar');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const fpsDisplay = document.getElementById('fps-display');
        const loadingElement = document.getElementById('loading');

        let lastLetter = '';
        let lastConfidence = 0;
        let detectionCount = 0;
        let handsInstance = null;
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        // Check if getUserMedia is available
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            loadingElement.innerHTML = `
                <div style="font-size:48px;">⚠️</div>
                <div style="font-size:18px;font-weight:600;margin-top:12px;color:white;">Camera Not Supported</div>
                <div style="font-size:14px;color:rgba(255,255,255,0.5);margin-top:8px;">Your browser doesn't support camera access</div>
            `;
            statusDot.className = 'dot error';
            statusText.textContent = 'Not Supported';
        }

        function initMediaPipe() {
            try {
                handsInstance = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                handsInstance.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                handsInstance.onResults(onResults);
                statusText.textContent = 'Ready';

            } catch (err) {
                console.error('MediaPipe init error:', err);
                statusText.textContent = 'MediaPipe error';
            }
        }

        // ============================================================
        // IMPROVED: Drawing with beautiful hand mesh
        // ============================================================
        function onResults(results) {
            loadingElement.style.display = 'none';

            // Update FPS
            frameCount++;
            const now = performance.now();
            if (now - lastFpsUpdate > 1000) {
                fpsDisplay.textContent = `⚡ ${frameCount} FPS`;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            statusDot.className = 'dot active';
            statusText.textContent = 'Detecting';

            // Dynamically resize canvas to match the screen container's display pixels with high DPI support
            const container = document.getElementById('container');
            const displayWidth = container.clientWidth;
            const displayHeight = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            const targetWidth = displayWidth * dpr;
            const targetHeight = displayHeight * dpr;

            if (canvasElement.width !== targetWidth || canvasElement.height !== targetHeight) {
                canvasElement.width = targetWidth;
                canvasElement.height = targetHeight;
            }

            // Clear in absolute coordinates
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const videoWidth = videoElement.videoWidth || 640;
                const videoHeight = videoElement.videoHeight || 480;

                canvasCtx.save();
                canvasCtx.scale(dpr, dpr);

                // Draw beautiful high-definition hand mesh aligned with object-fit: cover video
                drawHandMesh(canvasCtx, landmarks, displayWidth, displayHeight, videoWidth, videoHeight);

                canvasCtx.restore();

                const result = detectLetter(landmarks);

                letterElement.textContent = result.letter;
                const confPercent = Math.round(result.confidence * 100);
                confidenceElement.textContent = `Confidence: ${confPercent}%`;
                confidenceBar.style.width = `${confPercent}%`;

                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        letter: result.letter,
                        confidence: result.confidence
                    }));
                }

                lastLetter = result.letter;
                lastConfidence = result.confidence;
                detectionCount++;
            } else {
                if (detectionCount > 0) {
                    letterElement.textContent = '✋';
                    confidenceElement.textContent = 'Confidence: 0%';
                    confidenceBar.style.width = '0%';
                    statusDot.className = 'dot waiting';
                    statusText.textContent = 'Show your hand';
                    detectionCount = 0;
                }
            }
        }

        // ============================================================
        // IMPROVED: Beautiful high-definition cybernetic hand mesh
        // ============================================================
        function drawHandMesh(ctx, landmarks, cWidth, cHeight, vWidth, vHeight) {
            // Hand connections - standard MediaPipe skeleton connections
            const connections = [
                // Thumb
                [0, 1], [1, 2], [2, 3], [3, 4],
                // Index
                [0, 5], [5, 6], [6, 7], [7, 8],
                // Middle
                [5, 9], [9, 10], [10, 11], [11, 12],
                // Ring
                [9, 13], [13, 14], [14, 15], [15, 16],
                // Pinky
                [13, 17], [17, 18], [18, 19], [19, 20],
                // Palm base
                [0, 17], [5, 9], [9, 13], [13, 17]
            ];

            // 1. Calculate object-fit: cover scale and cropping offset
            const s = Math.max(cWidth / vWidth, cHeight / vHeight);
            const scaledWidth = vWidth * s;
            const scaledHeight = vHeight * s;
            const offsetX = (cWidth - scaledWidth) / 2;
            const offsetY = (cHeight - scaledHeight) / 2;

            // 2. Convert landmarks to canvas viewport coordinates (with X-axis mirrored for selfie camera view)
            const pts = landmarks.map(lm => ({
                x: (1 - lm.x) * vWidth * s + offsetX,
                y: lm.y * vHeight * s + offsetY,
                z: lm.z
            }));

            // 3. Dynamically scale lines/glows relative to hand palm size (distance from wrist 0 to middle MCP 9)
            const palmSize = Math.sqrt(
                Math.pow(pts[0].x - pts[9].x, 2) +
                Math.pow(pts[0].y - pts[9].y, 2)
            ) || 80;

            // ---- Draw Translucent Glowing Palm Mesh ----
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            ctx.lineTo(pts[1].x, pts[1].y);
            ctx.lineTo(pts[2].x, pts[2].y);
            ctx.lineTo(pts[5].x, pts[5].y);
            ctx.lineTo(pts[9].x, pts[9].y);
            ctx.lineTo(pts[13].x, pts[13].y);
            ctx.lineTo(pts[17].x, pts[17].y);
            ctx.closePath();

            const palmGrad = ctx.createRadialGradient(
                pts[9].x, pts[9].y, palmSize * 0.2,
                pts[9].x, pts[9].y, palmSize * 1.5
            );
            palmGrad.addColorStop(0, 'rgba(255, 215, 0, 0.12)'); // Gold center glow
            palmGrad.addColorStop(0.5, 'rgba(78, 205, 196, 0.06)'); // Cyan middle glow
            palmGrad.addColorStop(1, 'rgba(15, 49, 114, 0)'); // Outward fade
            ctx.fillStyle = palmGrad;
            ctx.fill();

            // Palm outline
            ctx.strokeStyle = 'rgba(78, 205, 196, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // ---- Draw Horizontal Webbing / Grid Mesh Lines ----
            const meshLines = [
                // PIP joints
                [6, 10], [10, 14], [14, 18],
                // DIP joints
                [7, 11], [11, 15], [15, 19],
                // Fingertips
                [8, 12], [12, 16], [16, 20]
            ];

            ctx.strokeStyle = 'rgba(78, 205, 196, 0.25)';
            ctx.lineWidth = 0.75;
            ctx.setLineDash([2, 4]); // Dashed scanlines
            meshLines.forEach(([i, j]) => {
                if (i < pts.length && j < pts.length) {
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
            });
            ctx.setLineDash([]); // Reset

            // ---- Draw Standard Skeletal Connections ----
            // Base layer: thicker neon glow
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.18)';
            ctx.lineWidth = Math.max(2.5, palmSize * 0.035);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            connections.forEach(([i, j]) => {
                if (i < pts.length && j < pts.length) {
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
            });

            // Top layer: bright thin core
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = Math.max(1, palmSize * 0.012);
            connections.forEach(([i, j]) => {
                if (i < pts.length && j < pts.length) {
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
            });

            // ---- Draw Holographic Joints ----
            const fingertips = [4, 8, 12, 16, 20];
            const fingerBases = [2, 6, 10, 14, 18];

            pts.forEach((pt, i) => {
                const isFingertip = fingertips.includes(i);
                const isBase = fingerBases.includes(i);
                const isPalm = i === 0 || i === 5 || i === 9 || i === 13 || i === 17;

                let radius = Math.max(2, palmSize * 0.025);
                let innerColor = 'rgba(78, 205, 196, 0.9)'; // Cyan core
                let outerColor = 'rgba(78, 205, 196, 0.25)';

                if (isFingertip) {
                    radius = Math.max(4.5, palmSize * 0.045);
                    innerColor = 'rgba(255, 215, 0, 1)'; // Gold core
                    outerColor = 'rgba(255, 215, 0, 0.35)';
                } else if (isBase) {
                    radius = Math.max(2.5, palmSize * 0.03);
                    innerColor = 'rgba(78, 205, 196, 0.8)';
                    outerColor = 'rgba(78, 205, 196, 0.18)';
                } else if (isPalm) {
                    radius = Math.max(3, palmSize * 0.035);
                    innerColor = 'rgba(255, 215, 0, 0.8)';
                    outerColor = 'rgba(255, 215, 0, 0.18)';
                }

                // Outer halo
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius * 1.8, 0, 2 * Math.PI);
                ctx.fillStyle = outerColor;
                ctx.fill();

                // Inner core with radial reflection gradient
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                const grad = ctx.createRadialGradient(
                    pt.x - radius * 0.2, pt.y - radius * 0.2, 0,
                    pt.x, pt.y, radius
                );
                grad.addColorStop(0, '#ffffff'); // Center reflection
                grad.addColorStop(0.3, innerColor);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
                ctx.fillStyle = grad;
                ctx.fill();

                // Border
                ctx.strokeStyle = isFingertip ? 'rgba(255, 215, 0, 0.7)' : 'rgba(78, 205, 196, 0.5)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            });

            // ---- Draw Finger Tracking Guide Lines (Subtle) ----
            const fingerIndices = [
                [0, 4],  // Thumb
                [5, 8],  // Index
                [9, 12], // Middle
                [13, 16],// Ring
                [17, 20] // Pinky
            ];

            ctx.strokeStyle = 'rgba(78, 205, 196, 0.15)';
            ctx.lineWidth = 0.75;
            ctx.setLineDash([3, 6]);
            fingerIndices.forEach(([start, end]) => {
                if (start < pts.length && end < pts.length) {
                    ctx.beginPath();
                    ctx.moveTo(pts[start].x, pts[start].y);
                    ctx.lineTo(pts[end].x, pts[end].y);
                    ctx.stroke();
                }
            });
            ctx.setLineDash([]);
        }

        // ============================================================
        // Camera and processing loop
        // ============================================================
        async function startCamera() {
            try {
                statusText.textContent = 'Requesting camera...';

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });

                videoElement.srcObject = stream;
                await videoElement.play();

                statusText.textContent = 'Camera ready';
                loadingElement.style.display = 'none';

                initMediaPipe();
                processFrame();

            } catch (err) {
                console.error('Camera error:', err);
                loadingElement.innerHTML = `
                    <div style="font-size:48px;">📷</div>
                    <div style="font-size:18px;font-weight:600;margin-top:12px;color:white;">Camera Access Denied</div>
                    <div style="font-size:14px;color:#EF4444;margin-top:8px;">${err.message}</div>
                    <div style="font-size:14px;color:rgba(255,255,255,0.5);margin-top:12px;">Please allow camera access in your browser settings</div>
                    <button onclick="location.reload()" style="margin-top:16px;padding:10px 30px;background:#FFD700;color:#0f3172;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">
                        🔄 Retry
                    </button>
                `;
                statusDot.className = 'dot error';
                statusText.textContent = 'Error';
            }
        }

        async function processFrame() {
            if (!handsInstance || !videoElement || videoElement.readyState < 2) {
                requestAnimationFrame(processFrame);
                return;
            }

            try {
                await handsInstance.send({ image: videoElement });
            } catch (err) {
                // Silent fail
            }

            requestAnimationFrame(processFrame);
        }

        // ============================================================
        // START
        // ============================================================
        startCamera();

        window.addEventListener('beforeunload', () => {
            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
        });

        console.log('SENAS Gesture Recognition WebView loaded!');
    </script>
