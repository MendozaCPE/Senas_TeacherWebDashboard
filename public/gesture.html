<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENAS Gesture Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a1628;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #overlay {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #letter-display {
            display: inline-block;
            background: rgba(15, 49, 114, 0.85);
            padding: 12px 28px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(12px);
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #letter {
            color: #FFD700;
            font-size: 56px;
            font-weight: bold;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        #confidence {
            color: #4ECDC4;
            font-size: 13px;
            margin-top: 2px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            margin-top: 4px;
            font-weight: 500;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .dot.active {
            background: #10B981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .dot.waiting {
            background: #F59E0B;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .dot.error {
            background: #EF4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 20;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            z-index: 5;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FF6B6B);
            transition: width 0.3s ease;
            width: 0%;
            border-radius: 0 2px 2px 0;
        }

        #status-bar {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
            pointer-events: none;
        }

        #status-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px 6px 10px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #status-bar-left .dot {
            width: 8px;
            height: 8px;
            margin-right: 0;
        }

        #status-bar-left .label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            font-weight: 500;
        }

        #fps-display {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #detection-box {
            position: absolute;
            border: 2px solid rgba(10, 90, 180, 0.6);
            border-radius: 12px;
            pointer-events: none;
            z-index: 4;
            display: none;
            box-shadow: 0 0 30px rgba(10, 90, 180, 0.15);
            transition: all 0.1s ease;
        }

        #camera-switch-btn {
            position: absolute;
            top: 40px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 16;
            cursor: pointer;
        }

        #camera-switch-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* ── Compact / Embedded Mode (iframe testing environment) ── */
        body.compact-mode #overlay {
            bottom: 8px;
            left: 8px;
            right: auto;
            text-align: left;
        }

        body.compact-mode #letter-display {
            padding: 6px 12px;
            min-width: 0;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: none;
        }

        body.compact-mode #letter {
            font-size: 22px;
            line-height: 1.1;
        }

        body.compact-mode #confidence {
            font-size: 10px;
            margin-top: 1px;
        }

        body.compact-mode #status {
            display: none;
        }

        body.compact-mode #status-bar {
            top: 8px;
            left: 8px;
            right: 8px;
        }

        body.compact-mode #status-bar-left {
            padding: 4px 10px;
            font-size: 10px;
        }

        body.compact-mode #fps-display {
            font-size: 10px;
            padding: 3px 8px;
        }

        body.compact-mode #camera-switch-btn {
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
        }

        body.compact-mode #camera-switch-btn svg {
            width: 15px;
            height: 15px;
        }

        /* Detection box: keep but lighter */
        body.compact-mode #detection-box {
            border-width: 1px;
            border-color: rgba(78, 205, 196, 0.5);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="detection-box"></div>

        <div id="camera-switch-btn" onclick="switchCamera()" title="Switch camera">
            <svg viewBox="0 0 24 24">
                <path
                    d="M9 3l-1.5 2H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2h-3.5L15 3H9zm3 5a5 5 0 110 10 5 5 0 010-10zm5.5-.5l2 2-2 2v-1.5H15v-1h2.5V7.5zM6.5 15l-2-2 2-2v1.5H9v1H6.5V15z" />
            </svg>
        </div>

        <div id="status-bar">
            <div id="status-bar-left">
                <span class="dot waiting" id="statusDot"></span>
                <span class="label" id="statusText">Initializing...</span>
            </div>
            <div id="fps-display">⚡ 0 FPS</div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <div style="font-size:18px;font-weight:600;color:white;">Loading SENAS...</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:8px;">Initializing camera and models</div>
        </div>

        <div id="overlay">
            <div id="letter-display">
                <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:2px;">
                    <span
                        style="color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;letter-spacing:1px;">DETECTED</span>
                </div>
                <div id="letter">✋</div>
                <div id="confidence">Confidence: 0%</div>
                <div id="status"></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="confidenceBar"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/tf-tflite.min.js"></script>

    <script>
        // Compact mode: minimize UI when loaded inside an iframe (testing dashboard)
        if (window.parent && window.parent !== window) {
            document.body.classList.add('compact-mode');
        }

        // ============================================================
        // UTILITY DISTANCE CODES
        // ============================================================
        function getDistance2D(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // ============================================================
        // CALIBRATED HEURISTIC FUNCTIONS FOR PORTRAIT MOBILE WEBVIEWS
        // ============================================================
        function getFingerStates(landmarks) {
            const tips = [4, 8, 12, 16, 20];
            const mcps = [2, 5, 9, 13, 17];
            const pips = [3, 6, 10, 14, 18];
            const fingers = [];

            const handScale = getDistance2D(landmarks[0], landmarks[5]);

            // Thumb calculation: Extended out laterally or up
            const thumbExtended = Math.abs(landmarks[4].x - landmarks[2].x) > (handScale * 0.35) || (landmarks[4].y < landmarks[2].y - handScale * 0.1);
            fingers.push(thumbExtended);

            // Rest of fingers logic
            for (let i = 1; i < tips.length; i++) {
                const extended = landmarks[tips[i]].y < (landmarks[pips[i]].y - (handScale * 0.05));
                fingers.push(extended);
            }
            return fingers;
        }

        function getFingerSpread(landmarks) {
            const indexLength = getDistance2D(landmarks[5], landmarks[8]);
            const tipSpread = getDistance2D(landmarks[8], landmarks[12]);
            return (tipSpread / (indexLength || 1));
        }

        function verifyZigzagGeometry(points) {
            if (points.length < 3) return false;
            const xs = points.map(p => p[0]);
            const ys = points.map(p => p[1]);
            const width = Math.max(...xs) - Math.min(...xs);
            const height = Math.max(...ys) - Math.min(...ys);
            return (width > 1.5 || height > 1.5);
        }

        function verifyJScoopGeometry(points) {
            return points.length >= 2;
        }

        // ============================================================
        // OVERHAULED CALIBRATION ENGINE MATRIX
        // ============================================================

        function processHierarchicalOverrides(predicted, avgConf, landmarks, isActivelyDrawing) {
            if (isActivelyDrawing && (predicted === 'Z' || predicted === 'J')) {
                return { letter: predicted, confidence: 0.99 };
            }

            const handScale = getDistance2D(landmarks[0], landmarks[5]);
            const fingers = getFingerStates(landmarks);
            const fingerSpread = getFingerSpread(landmarks);

            // Coordinates cache
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const thumbIP = landmarks[3];
            const thumbMcp = landmarks[2];

            const indexTip = landmarks[8];
            const indexDip = landmarks[7];
            const indexPip = landmarks[6];
            const indexMcp = landmarks[5];

            const middleTip = landmarks[12];
            const middleDip = landmarks[11];
            const middlePip = landmarks[10];
            const middleMcp = landmarks[9];

            const ringTip = landmarks[16];
            const ringPip = landmarks[14];
            const ringMcp = landmarks[13];

            const pinkyTip = landmarks[20];
            const pinkyPip = landmarks[18];
            const pinkyMcp = landmarks[17];

            // Base State Separation
            const indexUp = fingers[1];
            const middleUp = fingers[2];
            const ringUp = fingers[3];
            const pinkyUp = fingers[4];
            const thumbUp = fingers[0];

            const distThumbIndex = getDistance2D(thumbTip, indexTip);
            const distThumbMiddle = getDistance2D(thumbTip, middleTip);
            const distThumbRing = getDistance2D(thumbTip, ringTip);
            const distThumbPinky = getDistance2D(thumbTip, pinkyTip);

            // True Fist Check (Distance-based: highly robust against side-views where Y-coords fail)
            const indexCurled = getDistance2D(indexTip, indexMcp) < (handScale * 0.7);
            const middleCurled = getDistance2D(middleTip, middleMcp) < (handScale * 0.7);
            const ringCurled = getDistance2D(ringTip, ringMcp) < (handScale * 0.7);
            const pinkyCurled = getDistance2D(pinkyTip, pinkyMcp) < (handScale * 0.7);
            const isTrueFist = indexCurled && middleCurled && ringCurled && pinkyCurled;
            const isFistState = !indexUp && !middleUp && !ringUp && !pinkyUp;

            // =====================================================================
            // 1. DIRECTIONAL OVERRIDES & STATES 
            // =====================================================================
            const indexIsDownwards = indexTip.y > indexMcp.y + (handScale * 0.15);
            const middleIsDownwards = middleTip.y > middleMcp.y + (handScale * 0.15);

            const indexSideways = Math.abs(indexTip.x - indexMcp.x) > (handScale * 0.25) && Math.abs(indexTip.y - indexMcp.y) < (handScale * 0.55);
            const middleSideways = Math.abs(middleTip.x - middleMcp.x) > (handScale * 0.25) && Math.abs(middleTip.y - middleMcp.y) < (handScale * 0.55);
            const indexUpwards = indexTip.y < indexMcp.y - (handScale * 0.15);

            // Hook states for C micro-checks
            const isIndexHooked = (indexTip.y > indexPip.y) ||
                (getDistance2D(indexTip, indexMcp) < handScale * 0.45) ||
                (getDistance2D(indexTip, indexDip) < handScale * 0.12);

            // =====================================================================
            // 2. 🌟 THE MASTER 'X' DETECTOR 
            // =====================================================================
            const indexBaseLen = getDistance2D(indexPip, indexMcp);
            const indexTotalLen = getDistance2D(indexTip, indexMcp);
            const middleTotalLen = getDistance2D(middleTip, middleMcp);
            const ringTotalLen = getDistance2D(ringTip, ringMcp);
            const pinkyTotalLen = getDistance2D(pinkyTip, pinkyMcp);

            const isDefinitivelyHookedX = indexTotalLen < (indexBaseLen * 2.1) && indexTotalLen > (indexBaseLen * 0.5);
            const othersAreClosed = middleTotalLen < (handScale * 0.75) && ringTotalLen < (handScale * 0.75) && pinkyTotalLen < (handScale * 0.75);

            if (isDefinitivelyHookedX && othersAreClosed && !isFistState && !indexSideways) {
                const distThumbToIndexPip = getDistance2D(thumbTip, indexPip);
                if (distThumbToIndexPip > (handScale * 0.22)) {
                    return { letter: 'X', confidence: 0.99 };
                }
            }

            // -------------------------------------------------------------------------
            // GEOMETRIC PRE-CHECKS: C & O PROTECTION MATRIX 
            // -------------------------------------------------------------------------
            const isEnclosedO = distThumbIndex < (handScale * 0.35) && distThumbMiddle < (handScale * 0.35) &&
                distThumbRing < (handScale * 0.38) && distThumbPinky < (handScale * 0.42);

            if (isEnclosedO || predicted === 'O') {
                if (!indexUp && !middleUp) {
                    return { letter: 'O', confidence: 0.99 };
                }
            }

            const indexCurvedC = indexTip.y > indexDip.y && indexTip.y < indexMcp.y + (handScale * 0.12);
            const middleCurvedC = middleTip.y > middleDip.y && middleTip.y < middleMcp.y + (handScale * 0.12);
            const isThumbOpenC = thumbTip.y > indexMcp.y && Math.abs(thumbTip.x - indexMcp.x) > (handScale * 0.30);

            if ((indexCurvedC && middleCurvedC && isThumbOpenC && !indexUp && !middleUp) || predicted === 'C') {
                if (predicted === 'C' || (!indexUp && !middleUp && distThumbIndex > handScale * 0.26 && predicted !== 'H' && predicted !== 'K')) {
                    return { letter: 'C', confidence: 0.99 };
                }
            }

            // -------------------------------------------------------------------------
            // HORIZONTAL H & K DETECTOR (FIXED)
            // -------------------------------------------------------------------------
            // Fix: Abort H/K if the index and middle fingers are tightly curled (like in a side-view T)
            if (!ringUp && !pinkyUp && predicted !== 'C' && predicted !== 'O' && predicted !== 'T' && predicted !== 'X' && !(indexCurled && middleCurled)) {
                const indexExtendedSide = (indexMcp.x - indexTip.x) > (handScale * 0.28) || indexSideways;
                const middleExtendedSide = (middleMcp.x - middleTip.x) > (handScale * 0.22) || middleSideways;

                if (indexExtendedSide && middleExtendedSide) {
                    const distTips = getDistance2D(indexTip, middleTip);
                    const isKSpread = distTips > (handScale * 0.28);
                    const isHClosePair = distTips < (handScale * 0.25) && thumbTip.y > indexTip.y;

                    if ((isHClosePair || !isKSpread) && (predicted === 'H' || predicted === 'G' || predicted === 'A' || isFistState)) {
                        return { letter: 'H', confidence: 0.99 };
                    }
                    if (isKSpread || predicted === 'K') {
                        return { letter: 'K', confidence: 0.99 };
                    }
                }
            }

            // -------------------------------------------------------------------------
            // COMMON DISTANCES FOR FIST-BASED LETTERS (T, S, M, N, A)
            // -------------------------------------------------------------------------
            const distThumbToIndexPip = getDistance2D(thumbTip, indexPip);
            const distThumbToIndexMcp = getDistance2D(thumbTip, indexMcp);
            const distThumbToMiddlePip = getDistance2D(thumbTip, middlePip);
            const distThumbToMiddleMcp = getDistance2D(thumbTip, middleMcp);

            // A straight or outward 'A' has the thumb resting on the lateral outside of the index finger.
            // It will be relatively far from the middle finger joints compared to tucked (T) or crossed (S) thumbs.
            const isOutsideThumbA = distThumbToMiddleMcp > (handScale * 0.32) && distThumbToMiddlePip > (handScale * 0.32);

            // -------------------------------------------------------------------------
            // T DETECTOR (STRICT FOR 'A', ACCOMMODATES SIDE VIEW 'T')
            // -------------------------------------------------------------------------
            if (isFistState || isTrueFist || predicted === 'T' || (!middleUp && !ringUp && !pinkyUp && !isIndexHooked)) {

                const isThumbBetweenKnucklesX = (thumbTip.x > Math.min(indexMcp.x, middleMcp.x)) && (thumbTip.x < Math.max(indexMcp.x, middleMcp.x));

                // Fix: Ensure we don't swallow a straight-thumb 'A' by demanding the thumb is NOT purely on the outside.
                if (
                    (!isOutsideThumbA && distThumbToIndexPip < (handScale * 0.28) && distThumbToIndexPip < distThumbToIndexMcp) ||
                    (isThumbBetweenKnucklesX && thumbTip.y > indexMcp.y)
                ) {
                    // Ensure the thumb hasn't crossed entirely to the middle finger (protects S)
                    if (distThumbToMiddlePip > (handScale * 0.22) || predicted === 'T') {
                        return { letter: 'T', confidence: 0.99 };
                    }
                }
            }

            // -------------------------------------------------------------------------
            // INVERTED HANDS (P & Q)
            // -------------------------------------------------------------------------
            if (indexIsDownwards && middleIsDownwards && ringTip.y < ringMcp.y + (handScale * 0.2)) {
                return { letter: 'P', confidence: 0.99 };
            }

            if (indexIsDownwards && !middleIsDownwards && ringTip.y < ringMcp.y + (handScale * 0.2) && (predicted === 'Q' || predicted === 'G' || predicted === 'P')) {
                return { letter: 'Q', confidence: 0.99 };
            }

            // -------------------------------------------------------------------------
            // SAFE ZONE: M, N, S STABILITY MATRIX
            // -------------------------------------------------------------------------
            if (isFistState || isTrueFist) {
                const distThumbRingMcp = getDistance2D(thumbTip, ringMcp);
                const distThumbIndexMcp = getDistance2D(thumbTip, indexMcp); // Kept for M/N checks
                const ringTipY = ringTip.y;
                const middleTipY = middleTip.y;

                // 1. Strict S Catch (Evaluated first so N cannot steal it)
                // In S, the thumb securely crosses over the front of the fingers (near the PIPs).
                if (!isOutsideThumbA && (distThumbToMiddlePip < (handScale * 0.26) || distThumbToIndexPip < (handScale * 0.26) || predicted === 'S')) {
                    // Prevent A from incorrectly triggering S
                    if (distThumbToIndexPip < distThumbIndexMcp || predicted === 'S') {
                        return { letter: 'S', confidence: 0.99 };
                    }
                }

                // 2. M
                if (distThumbRingMcp < (handScale * 0.28) &&
                    ringTipY > ringMcp.y &&
                    middleTipY > middleMcp.y &&
                    distThumbRingMcp < distThumbToMiddleMcp &&
                    distThumbRingMcp < distThumbIndexMcp) {
                    return { letter: 'M', confidence: 0.99 };
                }

                // 3. N
                if (distThumbToMiddleMcp < (handScale * 0.26) &&
                    middleTipY > middleMcp.y &&
                    ringTipY > ringMcp.y &&
                    distThumbToMiddleMcp < distThumbIndexMcp) {
                    return { letter: 'N', confidence: 0.99 };
                }

                // 4. Fallback S (prevents swallowing A by dropping the indexMcp check)
                if (!isOutsideThumbA && distThumbToMiddleMcp < (handScale * 0.26)) {
                    return { letter: 'S', confidence: 0.99 };
                }

                if (predicted === 'M' || predicted === 'N') {
                    return { letter: predicted, confidence: 0.95 };
                }
            }

            // FLAT PALM CHECK FOR B
            const allExtendedUp = indexTip.y < indexPip.y && middleTip.y < middlePip.y && ringTip.y < ringPip.y && pinkyTip.y < pinkyPip.y;
            if (allExtendedUp) {
                return { letter: 'B', confidence: 0.99 };
            }

            // Strict I Detector
            if (pinkyUp && !indexUp && !middleUp && !ringUp && Math.abs(thumbTip.x - indexMcp.x) < (handScale * 0.35)) {
                return { letter: 'I', confidence: 0.99 };
            }

            // Strict Y Detector
            const horizontalYSpread = Math.abs(thumbTip.x - pinkyTip.x);
            if (pinkyUp && thumbUp && !indexUp && !middleUp && !ringUp && horizontalYSpread > (handScale * 0.62)) {
                return { letter: 'Y', confidence: 0.99 };
            }

            // -------------------------------------------------------------------------
            // VERTICAL/DIAGONAL K DETECTOR
            // -------------------------------------------------------------------------
            if (indexUp && middleUp && !ringUp && !pinkyUp && !isIndexHooked) {
                const fingersSpread = getDistance2D(indexTip, middleTip) > (handScale * 0.22);
                const isPointingUp = indexUpwards && middleUp &&
                    indexTip.y < indexMcp.y - (handScale * 0.3) &&
                    middleTip.y < middleMcp.y - (handScale * 0.3);

                const isHorizontal = (indexSideways || middleSideways) && !indexIsDownwards && !middleIsDownwards;
                const isDiagonal = Math.abs(indexTip.x - indexMcp.x) > (handScale * 0.15) &&
                    Math.abs(indexTip.y - indexMcp.y) > (handScale * 0.15);

                if ((isHorizontal || isDiagonal || predicted === 'K') && fingersSpread && !isPointingUp) {
                    return { letter: 'K', confidence: 0.99 };
                }
            }

            // Strict G Shape
            if (indexSideways && !middleUp && !ringUp && !pinkyUp && thumbTip.y < indexMcp.y && !indexUpwards) {
                if (getDistance2D(thumbTip, indexPip) > (handScale * 0.25)) {
                    return { letter: 'G', confidence: 0.99 };
                }
            }

            // -------------------------------------------------------------------------
            // ROBUST D vs L SEPARATION
            // -------------------------------------------------------------------------
            if (!middleUp && !ringUp && !pinkyUp && !isFistState) {
                const indexExtended = (indexUp || indexUpwards || Math.abs(indexTip.x - indexMcp.x) > (handScale * 0.25)) && indexTip.y < indexPip.y;

                if (indexExtended) {
                    const thumbIsTuckedTight = getDistance2D(thumbTip, middleMcp) < (handScale * 0.39) ||
                        getDistance2D(thumbTip, ringMcp) < (handScale * 0.39) ||
                        getDistance2D(thumbTip, indexMcp) < (handScale * 0.39) ||
                        getDistance2D(thumbTip, middleTip) < (handScale * 0.32);

                    if (thumbIsTuckedTight && predicted !== 'L') {
                        return { letter: 'D', confidence: 0.99 };
                    }

                    const thumbExtendedOut = Math.abs(thumbTip.x - indexMcp.x) > (handScale * 0.36);
                    const thumbPointingUp = thumbTip.y < indexMcp.y - (handScale * 0.10);

                    if (thumbExtendedOut || thumbPointingUp || predicted === 'L') {
                        return { letter: 'L', confidence: 0.99 };
                    }

                    if (predicted === 'D') {
                        return { letter: 'D', confidence: 0.99 };
                    }
                }
            }

            // FIXED Q DETECTOR
            if ((indexIsDownwards || predicted === 'Q') && !middleUp && !ringUp && !pinkyUp) {
                if (getDistance2D(indexTip, indexMcp) > (handScale * 0.25)) {
                    return { letter: 'Q', confidence: 0.99 };
                }
            }

            // FINAL FIST MATRIX FALLBACKS (A, E)
            if (isFistState || isTrueFist) {
                const isEShape = indexTip.y < indexMcp.y && middleTip.y < middleMcp.y && indexTip.y > indexPip.y;
                if (isEShape || predicted === 'E') {
                    return { letter: 'E', confidence: 0.97 };
                }
                return { letter: 'A', confidence: 0.99 };
            }

            // MULTI-FINGER REGIME SEPARATION (W, V, U, R, F)
            if (indexUp && middleUp && ringUp && !pinkyUp) {
                return { letter: 'W', confidence: 0.99 };
            }

            if (indexUp && middleUp && !ringUp && !pinkyUp && !indexSideways) {
                const isCrossed = (middleTip.x > indexTip.x + 0.01) || (Math.abs(indexTip.x - middleTip.x) < 0.025);
                if (isCrossed || predicted === 'R') {
                    return { letter: 'R', confidence: 0.99 };
                }

                if (fingerSpread < 0.18 || getDistance2D(indexTip, middleTip) < (handScale * 0.32)) {
                    return { letter: 'U', confidence: 0.99 };
                } else {
                    return { letter: 'V', confidence: 0.99 };
                }
            }

            // F Rule
            const isFShape = (indexTip.y > middleTip.y) && (middleTip.y < middlePip.y) && (ringTip.y < ringPip.y);
            if (isFShape && distThumbIndex < (handScale * 0.35)) {
                return { letter: 'F', confidence: 0.99 };
            }

            return { letter: predicted, confidence: avgConf };
        }

        function detectLetter(landmarks, isActivelyDrawing) {
            if (!landmarks || landmarks.length < 21) {
                lstmFeatureSequenceBuffer = [];
                return { letter: '✋', confidence: 0 };
            }

            try {
                const fingers = getFingerStates(landmarks);
                const flatFeatures = [];
                landmarks.forEach(lm => {
                    flatFeatures.push(lm.x, lm.y, lm.z);
                });

                if (fingers[1] || fingers[4]) {
                    lstmFeatureSequenceBuffer.push(flatFeatures);
                    if (lstmFeatureSequenceBuffer.length > LSTM_SEQUENCE_LENGTH) {
                        lstmFeatureSequenceBuffer.shift();
                    }
                }

                let predictedLetter = 'A';
                let modelConfidence = 0.5;

                if (mobileNetModel) {
                    try {
                        const inputTensor = tf.tensor2d([flatFeatures], [1, 63], 'float32');
                        const outputTensor = mobileNetModel.predict(inputTensor);
                        const probabilities = outputTensor.dataSync();

                        const maxIdx = probabilities.indexOf(Math.max(...probabilities));
                        predictedLetter = ALPHABET[maxIdx] || 'A';
                        modelConfidence = probabilities[maxIdx] || 0.5;

                        inputTensor.dispose();
                        outputTensor.dispose();
                    } catch (e) {
                        console.warn('Inference fallback triggered:', e);
                    }
                }

                // Process cascading structural verification overrides
                let result = processHierarchicalOverrides(predictedLetter, modelConfidence, landmarks, isActivelyDrawing);

                if (result.letter === 'A' && (fingers[1] || fingers[2] || fingers[3] || fingers[4])) {
                    return { letter: '✋', confidence: 0.1 };
                }

                return result;

            } catch (error) {
                console.error('Hybrid Prediction Error:', error);
                return { letter: '✋', confidence: 0 };
            }
        }

        // ============================================================
        // MEDIAPIPE CORE INITIALIZER PIPELINES
        // ============================================================
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const letterElement = document.getElementById('letter');
        const confidenceElement = document.getElementById('confidence');
        const confidenceBar = document.getElementById('confidenceBar');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const fpsDisplay = document.getElementById('fps-display');
        const loadingElement = document.getElementById('loading');
        const detectionBox = document.getElementById('detection-box');

        let lastLetter = '';
        let lastConfidence = 0;
        let detectionCount = 0;
        let handsInstance = null;
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        let trailBuffer = [];
        let jTrackingCooldown = 0;
        const MAX_TRAIL = 25;

        let lastPinkyPos = { x: 0, y: 0 };
        let lastIndexPos = { x: 0, y: 0 };

        let mobileNetModel = null;
        let lstmModel = null;
        const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        let lstmFeatureSequenceBuffer = [];
        const LSTM_SEQUENCE_LENGTH = 30;

        let canvasWidth = 0;
        let canvasHeight = 0;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            loadingElement.innerHTML = `
                <div style="font-size:48px;">⚠️</div>
                <div style="font-size:18px;font-weight:600;margin-top:12px;color:white;">Camera Not Supported</div>
            `;
            statusDot.className = 'dot error';
            statusText.textContent = 'Not Supported';
        }

        function initMediaPipe() {
            try {
                handsInstance = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                handsInstance.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                handsInstance.onResults(onResults);
                statusText.textContent = 'MediaPipe Ready';
            } catch (err) {
                console.error('MediaPipe error:', err);
            }
        }

        async function loadSenaTfliteModels() {
            try {
                statusText.textContent = 'Loading AI Models...';
                mobileNetModel = await tflite.loadTFLiteModel('/models/mobilenetv2_alphabet.tflite');
                lstmModel = await tflite.loadTFLiteModel('/models/senas_lstm_dynamic.tflite');
                statusText.textContent = 'Models Ready';
            } catch (error) {
                console.error('Model initialization failed:', error);
                statusText.textContent = 'Models Offline';
            }
        }

        function getPixelCoords(landmark, videoWidth, videoHeight, displayWidth, displayHeight) {
            const s = Math.max(displayWidth / videoWidth, displayHeight / videoHeight);
            const scaledW = videoWidth * s;
            const scaledH = videoHeight * s;
            const offX = (displayWidth - scaledW) / 2;
            const offY = (displayHeight - scaledH) / 2;
            return {
                x: (currentFacingMode === 'user' ? (1 - landmark.x) : landmark.x) * videoWidth * s + offX,
                y: landmark.y * videoHeight * s + offY
            };
        }

        function onResults(results) {
            loadingElement.style.display = 'none';

            frameCount++;
            const now = performance.now();
            if (now - lastFpsUpdate > 1000) {
                fpsDisplay.textContent = `⚡ ${frameCount} FPS`;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            statusDot.className = 'dot active';
            statusText.textContent = 'Detecting';

            const container = document.getElementById('container');
            const displayWidth = container.clientWidth;
            const displayHeight = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            const targetWidth = displayWidth * dpr;
            const targetHeight = displayHeight * dpr;

            canvasWidth = displayWidth;
            canvasHeight = displayHeight;

            if (canvasElement.width !== targetWidth || canvasElement.height !== targetHeight) {
                canvasElement.width = targetWidth;
                canvasElement.height = targetHeight;
            }

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const videoWidth = videoElement.videoWidth || 640;
                const videoHeight = videoElement.videoHeight || 480;

                drawHandMesh(canvasCtx, landmarks, displayWidth, displayHeight, videoWidth, videoHeight);
                drawDetectionBox(canvasCtx, landmarks, displayWidth, displayHeight, videoWidth, videoHeight);

                const fingers = getFingerStates(landmarks);
                const indexTip = landmarks[8];
                const pinkyTip = landmarks[20];

                const indexTipPx = getPixelCoords(indexTip, videoWidth, videoHeight, displayWidth, displayHeight);
                const pinkyTipPx = getPixelCoords(pinkyTip, videoWidth, videoHeight, displayWidth, displayHeight);

                const pinkyVelocity = getDistance2D(pinkyTipPx, lastPinkyPos);
                const indexVelocity = getDistance2D(indexTipPx, lastIndexPos);

                lastPinkyPos = pinkyTipPx;
                lastIndexPos = indexTipPx;

                const isActivelyMovingHand = (pinkyVelocity > 3.0 || indexVelocity > 3.0);
                const isMovingZ = fingers[1] && !fingers[2] && !fingers[3] && !fingers[4] && isActivelyMovingHand;
                const isMovingJRaw = fingers[4] && !fingers[1] && !fingers[2] && !fingers[3] && isActivelyMovingHand;

                if (isMovingJRaw) {
                    jTrackingCooldown = 12;
                } else if (jTrackingCooldown > 0) {
                    jTrackingCooldown--;
                }
                const isMovingJ = (jTrackingCooldown > 0);

                if (isMovingZ || isMovingJ) {
                    const currentTip = isMovingZ ? indexTipPx : pinkyTipPx;
                    trailBuffer.push([currentTip.x, currentTip.y]);
                    if (trailBuffer.length > MAX_TRAIL) trailBuffer.shift();
                } else if (!isActivelyMovingHand && trailBuffer.length > 0) {
                    trailBuffer.shift();
                }

                if (trailBuffer.length > 1) {
                    for (let i = 1; i < trailBuffer.length; i++) {
                        const thickness = Math.max(2, Math.sqrt(25 / (i + 1)) * 3);
                        const alpha = Math.min(1, i / trailBuffer.length);

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(trailBuffer[i - 1][0], trailBuffer[i - 1][1]);
                        canvasCtx.lineTo(trailBuffer[i][0], trailBuffer[i][1]);
                        canvasCtx.strokeStyle = `rgba(255, 215, 0, ${alpha * 0.3})`;
                        canvasCtx.lineWidth = thickness * 3;
                        canvasCtx.stroke();

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(trailBuffer[i - 1][0], trailBuffer[i - 1][1]);
                        canvasCtx.lineTo(trailBuffer[i][0], trailBuffer[i][1]);
                        canvasCtx.strokeStyle = `rgba(255, 215, 0, ${alpha * 0.9})`;
                        canvasCtx.lineWidth = thickness;
                        canvasCtx.stroke();
                    }
                }

                const isActivelyDrawing = trailBuffer.length > 3;
                let result = detectLetter(landmarks, isActivelyDrawing);

                if (lstmModel && lstmFeatureSequenceBuffer.length === LSTM_SEQUENCE_LENGTH) {
                    try {
                        const lstmInputTensor = tf.tensor3d([lstmFeatureSequenceBuffer], [1, LSTM_SEQUENCE_LENGTH, 63], 'float32');
                        const lstmOutput = lstmModel.predict(lstmInputTensor);
                        const dynamicProbabilities = lstmOutput.dataSync();

                        const maxDynamicIdx = dynamicProbabilities.indexOf(Math.max(...dynamicProbabilities));
                        const dynamicConfidence = dynamicProbabilities[maxDynamicIdx];

                        if (dynamicConfidence > 0.82) {
                            if (isMovingJ && maxDynamicIdx === 0) {
                                result = { letter: 'J', confidence: dynamicConfidence };
                            } else if (isMovingZ && maxDynamicIdx === 1) {
                                result = { letter: 'Z', confidence: dynamicConfidence };
                            }
                        }
                        lstmInputTensor.dispose();
                        lstmOutput.dispose();
                    } catch (e) {
                        console.warn('LSTM context processing dropped frame:', e);
                    }
                }

                if (trailBuffer.length > 4) {
                    if (isMovingZ && verifyZigzagGeometry(trailBuffer)) {
                        result = { letter: 'Z', confidence: 0.98 };
                    } else if (isMovingJ && verifyJScoopGeometry(trailBuffer)) {
                        result = { letter: 'J', confidence: 0.96 };
                    }
                }

                const displayLetter = result.letter || '✋';
                letterElement.textContent = displayLetter;
                const confPercent = Math.round(Math.min(result.confidence * 100, 100));
                confidenceElement.textContent = `Confidence: ${confPercent}%`;
                confidenceBar.style.width = `${confPercent}%`;

                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        letter: result.letter,
                        confidence: result.confidence
                    }));
                }

                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'SENAS_DETECTION',
                        letter: result.letter || '✋',
                        confidence: result.confidence || 0,
                        landmarks: landmarks ? landmarks.map(lm => ({ x: lm.x, y: lm.y, z: lm.z })) : null,
                        timestamp: performance.now()
                    }, '*');
                }

                lastLetter = result.letter;
                lastConfidence = result.confidence;
                detectionCount++;
            } else {
                if (detectionCount > 0) {
                    letterElement.textContent = '✋';
                    confidenceElement.textContent = 'Confidence: 0%';
                    confidenceBar.style.width = '0%';
                    statusDot.className = 'dot waiting';
                    statusText.textContent = 'Show your hand';
                    detectionCount = 0;
                    detectionBox.style.display = 'none';
                    trailBuffer = [];

                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'SENAS_DETECTION',
                            letter: '✋',
                            confidence: 0,
                            landmarks: null,
                            timestamp: performance.now()
                        }, '*');
                    }
                }
            }

            canvasCtx.restore();
        }

        function drawDetectionBox(ctx, landmarks, cWidth, cHeight, vWidth, vHeight) {
            const xs = landmarks.map(lm => lm.x);
            const ys = landmarks.map(lm => lm.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);

            const handWidth = maxX - minX;
            const handHeight = maxY - minY;
            const handSize = Math.max(handWidth, handHeight);
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;

            const padding = 35;
            const boxMinX = Math.max(0, centerX - handSize / 2 - padding / vWidth);
            const boxMaxX = Math.min(1, centerX + handSize / 2 + padding / vWidth);
            const boxMinY = Math.max(0, centerY - handSize / 2 - padding / vHeight);
            const boxMaxY = Math.min(1, centerY + handSize / 2 + padding / vHeight);

            const s = Math.max(cWidth / vWidth, cHeight / vHeight);
            const scaledW = vWidth * s;
            const scaledH = vHeight * s;
            const offX = (cWidth - scaledW) / 2;
            const offY = (cHeight - scaledH) / 2;

            // Only mirror the x-axis when the front camera is active (it's the one shown flipped via CSS)
            const px1 = (currentFacingMode === 'user' ? (1 - boxMaxX) : boxMinX) * vWidth * s + offX;
            const py1 = boxMinY * vHeight * s + offY;
            const px2 = (currentFacingMode === 'user' ? (1 - boxMinX) : boxMaxX) * vWidth * s + offX;
            const py2 = boxMaxY * vHeight * s + offY;

            ctx.strokeStyle = 'rgba(10, 90, 180, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 6]);
            ctx.strokeRect(px1, py1, px2 - px1, py2 - py1);
            ctx.setLineDash([]);

            const cornerLen = 12;
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 2;

            ctx.beginPath(); ctx.moveTo(px1, py1 + cornerLen); ctx.lineTo(px1, py1); ctx.lineTo(px1 + cornerLen, py1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px2 - cornerLen, py1); ctx.lineTo(px2, py1); ctx.lineTo(px2, py1 + cornerLen); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px1, py2 - cornerLen); ctx.lineTo(px1, py2); ctx.lineTo(px1 + cornerLen, py2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px2 - cornerLen, py2); ctx.lineTo(px2, py2); ctx.lineTo(px2, py2 - cornerLen); ctx.stroke();
        }

        function drawHandMesh(ctx, landmarks, cWidth, cHeight, vWidth, vHeight) {
            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8],
                [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15],
                [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17], [5, 9],
                [9, 13], [13, 17]
            ];

            const s = Math.max(cWidth / vWidth, cHeight / vHeight);
            const scaledW = vWidth * s;
            const scaledH = vHeight * s;
            const offX = (cWidth - scaledW) / 2;
            const offY = (cHeight - scaledH) / 2;

            const pts = landmarks.map(lm => ({
                x: (currentFacingMode === 'user' ? (1 - lm.x) : lm.x) * vWidth * s + offX,
                y: lm.y * vHeight * s + offY,
                z: lm.z
            }));

            const palmSize = Math.sqrt(Math.pow(pts[0].x - pts[9].x, 2) + Math.pow(pts[0].y - pts[9].y, 2)) || 80;

            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y);
            ctx.lineTo(pts[5].x, pts[5].y); ctx.lineTo(pts[9].x, pts[9].y); ctx.lineTo(pts[13].x, pts[13].y);
            ctx.lineTo(pts[17].x, pts[17].y);
            ctx.closePath();

            const palmGrad = ctx.createRadialGradient(pts[9].x, pts[9].y, palmSize * 0.2, pts[9].x, pts[9].y, palmSize * 1.5);
            palmGrad.addColorStop(0, 'rgba(255, 215, 0, 0.12)');
            palmGrad.addColorStop(0.5, 'rgba(78, 205, 196, 0.06)');
            palmGrad.addColorStop(1, 'rgba(15, 49, 114, 0)');
            ctx.fillStyle = palmGrad; ctx.fill();

            ctx.strokeStyle = 'rgba(78, 205, 196, 0.3)'; ctx.lineWidth = 1; ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 215, 0, 0.18)';
            ctx.lineWidth = Math.max(2.5, palmSize * 0.035);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            connections.forEach(([i, j]) => {
                if (i < pts.length && j < pts.length) {
                    ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
                }
            });

            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = Math.max(1, palmSize * 0.012);
            connections.forEach(([i, j]) => {
                if (i < pts.length && j < pts.length) {
                    ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
                }
            });

            const fingertips = [4, 8, 12, 16, 20];
            const fingerBases = [2, 6, 10, 14, 18];

            pts.forEach((pt, i) => {
                const isFingertip = fingertips.includes(i);
                const isBase = fingerBases.includes(i);
                const isPalm = [0, 5, 9, 13, 17].includes(i);

                let radius = Math.max(2, palmSize * 0.025);
                let innerColor = 'rgba(78, 205, 196, 0.9)';
                let outerColor = 'rgba(78, 205, 196, 0.25)';

                if (isFingertip) {
                    radius = Math.max(4.5, palmSize * 0.045);
                    innerColor = 'rgba(255, 215, 0, 1)';
                    outerColor = 'rgba(255, 215, 0, 0.35)';
                } else if (isBase) {
                    radius = Math.max(2.5, palmSize * 0.03);
                    innerColor = 'rgba(78, 205, 196, 0.8)';
                    outerColor = 'rgba(78, 205, 196, 0.18)';
                } else if (isPalm) {
                    radius = Math.max(3, palmSize * 0.035);
                    innerColor = 'rgba(255, 215, 0, 0.8)';
                    outerColor = 'rgba(255, 215, 0, 0.18)';
                }

                ctx.beginPath(); ctx.arc(pt.x, pt.y, radius * 1.8, 0, 2 * Math.PI); ctx.fillStyle = outerColor; ctx.fill();

                ctx.beginPath(); ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                const grad = ctx.createRadialGradient(pt.x - radius * 0.2, pt.y - radius * 0.2, 0, pt.x, pt.y, radius);
                grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, innerColor); grad.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
                ctx.fillStyle = grad; ctx.fill();
            });
        }

        let currentFacingMode = 'user';
        let switchingCamera = false;

        async function startCamera(facingMode = 'user') {
            try {
                statusText.textContent = 'Opening camera...';

                // Stop any existing stream before opening a new one
                if (videoElement.srcObject) {
                    videoElement.srcObject.getTracks().forEach(track => track.stop());
                    videoElement.srcObject = null;
                }

                currentFacingMode = facingMode;
                // Only mirror the front (selfie) camera; the back camera should show normally
                videoElement.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } }
                });

                videoElement.srcObject = stream;
                await videoElement.play();

                statusText.textContent = 'Camera live';
                loadingElement.style.display = 'none';

                // MediaPipe/model init and the detection loop only need to start once
                if (!handsInstance) {
                    initMediaPipe();
                    await loadSenaTfliteModels();
                    processFrame();
                }
            } catch (err) {
                console.error('Camera access error:', err);
                loadingElement.innerHTML = `<div style="font-size:18px;color:white;">Camera Access Error</div>`;
            } finally {
                switchingCamera = false;
            }
        }

        async function switchCamera() {
            if (switchingCamera) return;
            switchingCamera = true;
            const nextFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            await startCamera(nextFacingMode);
        }

        // Allow the React Native host app to trigger a camera switch via postMessage
        function handleNativeMessage(event) {
            try {
                const data = JSON.parse(event.data);
                if (data && data.type === 'switch_camera') {
                    switchCamera();
                }
            } catch (e) { /* not a JSON message meant for us, ignore */ }
        }
        document.addEventListener('message', handleNativeMessage);
        window.addEventListener('message', handleNativeMessage);

        async function processFrame() {
            if (!handsInstance || !videoElement || videoElement.readyState < 2) {
                requestAnimationFrame(processFrame);
                return;
            }
            try {
                await handsInstance.send({ image: videoElement });
            } catch (err) { }
            requestAnimationFrame(processFrame);
        }

        startCamera();

        window.addEventListener('beforeunload', () => {
            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>

</html>
