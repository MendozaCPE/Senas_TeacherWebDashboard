$kind: http-request
name: 'GET Student Mastery'
method: GET
url: '{{base_url}}/api/student/mastery'
order: 4000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Mastery request succeeded', function () {
          pm.expect(pm.response.code).to.equal(200);
      });
